name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test (Node 26, Dart ${{ matrix.dart }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.11.3 guards the vendored fork's SDK floor; 3.13.4 is the dev box.
        dart: ['3.11.3', '3.13.4']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Dart is needed for the Dart indexer tests (vendored scip-dart fork + dart-surface).
      # Snapshots are identical across both versions; see docs/DESIGN.md.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}

      - run: npm ci

      - name: Warm the vendored Dart tools
        run: |
          dart pub get --directory packages/indexers/scip-dart
          dart pub get --directory packages/indexers/dart-surface

      - run: npm run typecheck

      - run: npm test

      - name: Snapshot drift
        if: failure()
        run: echo "If the snapshots test failed, run 'npm run snapshots:update' locally and review the diff (PLAN.md §6.6)."
